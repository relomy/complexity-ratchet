[project]
name = "complexity-ratchet"
version = "0.2.0"
description = "Fail when touched Python code regresses in cyclomatic complexity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "radon>=6.0",
]

[project.scripts]
complexity-ratchet = "complexity_ratchet:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["complexity_ratchet"]
